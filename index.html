
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow mx-auto" style="max-width: 700px;">
        <div class="card-header bg-primary text-white text-center">
            <h2>Student Registration Form</h2>
            <p class="mb-0"></p>
        </div>

        <div class="card-body p-4">
            <form action="#" method="post">

                <h5 class="mb-3 text-primary">Personal Information</h5>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control"
                           placeholder="Enter your full name" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Father's Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter father's name" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <h5 class="mb-3 mt-4 text-primary">Contact Information</h5>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control"
                               placeholder="example@email.com" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control"
                               placeholder="03XXXXXXXXX" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" rows="3"
                              placeholder="Enter your address" required></textarea>
                </div>

                <h5 class="mb-3 mt-4 text-primary">Academic Information</h5>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Roll Number</label>
                        <input type="text" class="form-control"
                               placeholder="Enter roll number" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Semester</label>
                        <select class="form-select" required>
                            <option value="">Select Semester</option>
                            <option>1st Semester</option>
                            <option>2nd Semester</option>
                            <option selected>3rd Semester</option>
                            <option>4th Semester</option>
                            <option>5th Semester</option>
                            <option>6th Semester</option>
                            <option>7th Semester</option>
                            <option>8th Semester</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <select class="form-select" required>
                        <option value="">Select Department</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Software Engineering</option>
                        <option>Electrical Engineering</option>
                        <option>Business Administration</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Previous Semester GPA</label>
                    <input type="number" class="form-control"
                           min="0" max="4" step="0.01"
                           placeholder="e.g. 3.25">
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox"
                           id="declaration" required>
                    <label class="form-check-label" for="declaration">
                        I confirm that the information provided is correct.
                    </label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Register
                    </button>
                    <button type="reset" class="btn btn-secondary w-100">
                        Reset
                    </button>
                </div>

            </form>
        </div>

        <div class="card-footer text-center text-muted">
            Student Registration Portal
        </div>
    </div>
</div>

</body>
</html>
